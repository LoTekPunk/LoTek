<title>Scattered Layout</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin:0; padding:0; height:100%; background:#1e1f2b; overflow:hidden; }
  body { font-family: system-ui,'Segoe UI',Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; }
  .stage { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 40%, #2f3145 0%, #1b1d2a 100%); touch-action: none; }
  .image-canvas { position: relative; width: 675px; height: 579px; background: #252734; border-radius: 24px; box-shadow: inset 0 0 0 1px #4a4d62, 0 25px 40px -10px black; overflow: hidden; border: 1px solid #5f6382; background-image: radial-gradient(circle at 30% 40%, #2f3145 0%, #1b1d2a 100%); transform-origin: center center; touch-action: none; flex: 0 0 auto; }
  .draggable-item { position:absolute; cursor:grab; transition:filter .15s; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); transform-origin:center center; touch-action:none; }
  .draggable-item.selected { outline:2px solid #b9b9ff; outline-offset:3px; filter:drop-shadow(0 0 12px #b1b1ff) drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  .video-wrapper { position:relative; background:#0a0a10; border-radius:10px; overflow:hidden; border:2px solid #3a3a55; }
  .video-wrapper iframe { display:block; width:100%; height:calc(100% - 20px); border:none; position:absolute; top:20px; left:0; z-index:1; }
  .video-drag-handle { position:absolute; top:0; left:0; right:0; height:20px; background:rgba(20,22,34,0.85); color:#cfd4e8; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; cursor:grab; z-index:50; border-bottom:1px solid #4a4d62; letter-spacing:.5px; touch-action:none; }
  .video-resize-grip { position:absolute; right:-2px; bottom:-2px; width:28px; height:28px; background:linear-gradient(135deg, transparent 50%, #8a8ae0 50%, #8a8ae0 62%, transparent 62%, transparent 72%, #8a8ae0 72%, #8a8ae0 82%, transparent 82%); cursor:nwse-resize; z-index:100; touch-action:none; pointer-events:auto; border-bottom-right-radius:4px; }
  .video-wrapper.selected { outline:2px solid #b9b9ff; outline-offset:3px; }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(8,9,14,0.88); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; cursor: zoom-out; padding: 24px; touch-action: none; }
  .lightbox.open { display: flex; }
  .lightbox img { display: block; max-width: calc(100vw - 48px); max-height: calc(100vh - 48px); width: auto; height: auto; border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); object-fit: contain; pointer-events: none; -webkit-user-drag: none; user-select: none; }
  .lightbox-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: #cfd4e8; font-size: 0.8rem; opacity: 0.7; background: rgba(20,22,34,0.7); padding: 6px 14px; border-radius: 40px; pointer-events: none; white-space: nowrap; }

  @media (max-width:640px) {
    .image-canvas { border-radius:12px; }
    .lightbox { padding: 12px; }
    .lightbox img { max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="image-canvas" id="imageCanvas">

<div class="draggable-item" data-type="video" style="left:262.278px; top:278.868px; transform:rotate(6.11335deg); cursor:grab;">

  <img src="images/newpaperArticle.jpg" alt="newpaperArticle.jpg" style="display:block; max-width:200px; max-height:200px; width:auto; height:auto; border-radius:6px; pointer-events:none;" draggable="false">

  <img src="images/onStageCloseUp.jpg" alt="onStageCloseUp.jpg" style="display:block; max-width:200px; max-height:200px; width:auto; height:auto; border-radius:6px; pointer-events:none;" draggable="false">

  <img src="images/songList.jpg" alt="songList.jpg" style="display:block; max-width:200px; max-height:200px; width:auto; height:auto; border-radius:6px; pointer-events:none;" draggable="false">
</div>
<div class="draggable-item" data-type="image" style="left:258.203px; top:347.067px; transform:rotate(11.9102deg); cursor:grab;">
  <img src="images/steveLyonsArticle.jpg" alt="steveLyonsArticle.jpg" style="display:block; max-width:200px; max-height:200px; width:auto; height:auto; border-radius:6px; pointer-events:none;" draggable="false">
</div>
  </div>
</div>
<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lightboxImg" alt="enlarged">
  <div class="lightbox-hint">double-click / click outside / Esc to close</div>
</div>
<script>
(function(){
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('imageCanvas');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const DESIGN_W = 675;
  const DESIGN_H = 579;

  // Fit-to-viewport scaling
  function fit() {
    const vw = stage.clientWidth;
    const vh = stage.clientHeight;
    const pad = 8;
    const scale = Math.min((vw - pad) / DESIGN_W, (vh - pad) / DESIGN_H, 1);
    canvas.style.transform = 'scale(' + scale + ')';
    canvas.dataset.scale = scale;
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 100));

  // Lightbox
  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || 'enlarged';
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!lightbox.classList.contains('open')) lightboxImg.src = ''; }, 300);
  }
  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  // Gestures
  let selectedItem = null;
  let activeGesture = null, dragTarget = null, dragIframe = null, dragOffsetX = 0, dragOffsetY = 0;
  let resizeTarget = null, resizeStartX = 0, resizeStartY = 0, resizeStartW = 0, resizeStartH = 0;

  function currentScale() { return parseFloat(canvas.dataset.scale) || 1; }
  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    const s = currentScale();
    return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
  }

  function bringToFront(el){ if(!el||!el.parentNode)return; if(canvas.lastElementChild===el)return; canvas.appendChild(el); }
  function clearSelection(){ if(selectedItem){ selectedItem.classList.remove('selected'); const vw=selectedItem.querySelector('.video-wrapper'); if(vw)vw.classList.remove('selected'); selectedItem=null; } }

  function beginGesture(type, wrapper, iframe, e){
    bringToFront(wrapper); clearSelection();
    wrapper.classList.add('selected');
    const vw = wrapper.querySelector('.video-wrapper'); if(vw) vw.classList.add('selected');
    selectedItem = wrapper;
    if(iframe) iframe.style.pointerEvents = 'none';
    activeGesture = type;
    if(type === 'drag'){
      dragTarget = wrapper; dragIframe = iframe || null;
      const p = canvasPoint(e);
      dragOffsetX = p.x - (parseFloat(wrapper.style.left)||0);
      dragOffsetY = p.y - (parseFloat(wrapper.style.top)||0);
    } else if(type === 'resize'){
      const vw2 = wrapper.querySelector('.video-wrapper');
      resizeTarget = { wrapper, videoWrapper: vw2, iframe };
      resizeStartX = e.clientX; resizeStartY = e.clientY;
      resizeStartW = vw2.offsetWidth; resizeStartH = vw2.offsetHeight;
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onEnd);
    document.addEventListener('pointercancel', onEnd);
  }

  function onMove(e){
    if(!activeGesture) return;
    const s = currentScale();
    if(activeGesture === 'drag'){
      const p = canvasPoint(e);
      let nl = p.x - dragOffsetX;
      let nt = p.y - dragOffsetY;
      const w = dragTarget.offsetWidth;
      const h = dragTarget.offsetHeight;
      nl = Math.min(Math.max(0, nl), Math.max(0, DESIGN_W - w));
      nt = Math.min(Math.max(0, nt), Math.max(0, DESIGN_H - h));
      dragTarget.style.left = nl + 'px';
      dragTarget.style.top = nt + 'px';
    } else if(activeGesture === 'resize'){
      const minW = 180, minH = 120;
      const dx = (e.clientX - resizeStartX) / s;
      const dy = (e.clientY - resizeStartY) / s;
      const wl = parseFloat(resizeTarget.wrapper.style.left)||0;
      const wt = parseFloat(resizeTarget.wrapper.style.top)||0;
      let nw = resizeStartW + dx;
      let nh = resizeStartH + dy;
      nw = Math.max(minW, Math.min(nw, DESIGN_W - wl - 4));
      nh = Math.max(minH, Math.min(nh, DESIGN_H - wt - 4));
      resizeTarget.videoWrapper.style.width = nw + 'px';
      resizeTarget.videoWrapper.style.height = nh + 'px';
    }
    if(e.cancelable) e.preventDefault();
  }

  function onEnd(){
    if(dragIframe) dragIframe.style.pointerEvents = '';
    if(resizeTarget && resizeTarget.iframe) resizeTarget.iframe.style.pointerEvents = '';
    activeGesture = null; dragTarget = null; dragIframe = null; resizeTarget = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
  }

  // Attach double-click handler for images and gesture handlers
  canvas.querySelectorAll('.draggable-item[data-type="image"]').forEach(el => {
    const img = el.querySelector('img');
    if (img) {
      el.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openLightbox(img.src, img.alt);
      });
    }
  });

  canvas.addEventListener('pointerdown', (e) => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const wrapper = e.target.closest('.draggable-item');
    if(!wrapper) return;
    const grip = wrapper.querySelector('.video-resize-grip');
    const handle = wrapper.querySelector('.video-drag-handle');
    const iframe = wrapper.querySelector('iframe');
    if(grip && (e.target === grip || grip.contains(e.target))){
      e.preventDefault(); e.stopPropagation();
      beginGesture('resize', wrapper, iframe, e); return;
    }
    if(handle && (e.target === handle || handle.contains(e.target))){
      e.preventDefault(); e.stopPropagation();
      beginGesture('drag', wrapper, iframe, e); return;
    }
    if(iframe && e.target === iframe) return;
    e.preventDefault(); e.stopPropagation();
    beginGesture('drag', wrapper, iframe, e);
  });

  canvas.addEventListener('click', (e) => {
    if(!e.target.closest('.draggable-item')) clearSelection();
  });
  canvas.addEventListener('dragstart', (e) => {
    if(e.target.closest('.draggable-item')) e.preventDefault();
  });
})();
</script>
</body>
</html>
